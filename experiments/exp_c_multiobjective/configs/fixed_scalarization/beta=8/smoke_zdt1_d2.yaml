# Fast smoke config for the fixed-scalarization pipeline (run -> process -> analyze).
# Tiny budget / few seeds / few restarts.  Not a scientific run.
experiment_mode: fixed_scalarization
tag: smoke_zdt1_d2_beta8

benchmark:
  name: zdt1
  input_dim: 2
  orientation: maximize
  normalization: fixed

methods:
  - right
  - wrong

scalarizations:
  - linear
  - hypervolume

lambda:
  mode: fixed_angles
  angles_degrees: [30, 60]

budget: 6
initial_design_size: 3

seeds:
  start: 1
  end: 2

noise:
  std: 1.0e-6

model:
  use_fixed_noise: true
  kernel: matern52

acquisition:
  type: ucb
  beta_schedule:
    type: constant
    value: 8.0
  raw_samples: 64
  num_restarts: 3

reference:
  pareto_front_resolution: 2000

diagnostics:
  save_posterior: false
  save_acquisition: false

device: cpu
