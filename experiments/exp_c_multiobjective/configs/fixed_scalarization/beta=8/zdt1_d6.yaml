# Experiment C — fixed scalarization.  ZDT1 (input_dim=6) has a convex (fully supported) front.
experiment_mode: fixed_scalarization
tag: zdt1_d6_beta8

benchmark:
  name: zdt1
  input_dim: 6
  orientation: maximize
  normalization: fixed

methods:
  - right
  - wrong

scalarizations:
  - linear
  - hypervolume

lambda:
  mode: fixed_angles
  angles_degrees: [10, 30, 45, 60, 80]

budget: 200
initial_design_size: 12

seeds:
  start: 1
  end: 50

noise:
  std: 1.0e-6

model:
  use_fixed_noise: true
  kernel: matern52

acquisition:
  type: ucb
  beta_schedule:
    type: constant
    value: 8.0
  raw_samples: 1024
  num_restarts: 20

reference:
  pareto_front_resolution: 10000

diagnostics:
  save_posterior: false
  save_acquisition: false

device: cpu
