target:                0.44
# UCB exploration schedule (Matern / GP-UCB-inspired).  Replaces the constant
# `beta`; `beta_schedule` takes priority over a scalar `beta`.  nu=2.5 matches
# the matern52 GP kernel and beta_t grows with an information-gain proxy
#   gamma_t = scale * (t+1)^(d(d+1)/(2 nu + d(d+1))) * log(t+1),
#   sqrt(beta_t) = B + R * sqrt(2 (gamma_{t-1} + 1 + log(1/delta))).
beta_schedule:
  type:  matern_gamma
  B:     1.0
  R:     1.0
  delta: 0.1
  nu:    2.5
  scale: 0.1
initial_design_size:   1
budget:                50

num_restarts:          20
raw_samples:           1024
device:                cpu

methods:
  - right_target_matching_ucb
  - wrong_gp_on_abs_lcb

epsilon:               0.015
failure_threshold:     0.015
near_target_epsilon:   0.05

test_grid:
  n_test:                    2048
  seed:                      123
  calibration_every:         1
  n_test_near_target:        512
  near_target_seed:          124
  m_test_joint_distrib:      64
  m_test_joint_near_target:  64
  joint_nlpd_jitter:         1.0e-6

calibration:
  compute_global:      true
  compute_near_target: true
  compute_joint:       true
  store_predictions:   true

aggregate:
  convergence_band_type:          pointwise
  calibration_band_type:          pointwise
  residual_band_type:             uniform
  n_bootstrap:                    10000
  confidence:                     0.95
  aggregate_calibration_curves:   true
  aggregate_instantaneous_curves: true

