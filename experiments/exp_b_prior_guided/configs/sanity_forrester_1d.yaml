# Sanity rerun (Experiment B, forrester_1d, GOOD prior): few seeds, moderate
# budget, raw oriented scale.  Used to confirm the corrected pipeline:
# vanilla UCB stays healthy and alpha-pi improves convergence speed.

experiment:            exp_b_prior_guided
tag:                   sanity_forrester_1d

benchmark:
  name: forrester_1d

# Observation noise on the RAW oriented scale (g = -f_raw, f_opt ~= 6.02).
noise_std:             0.5

seeds:                 [1, 2, 3, 4, 5]

# Gaussian domain prior pi_c(x) in [0, 1] (acquisition weight), native coords.
prior:
  label:       good
  center:      [0.757249]
  lengthscale: 0.15

alpha:                 0.5
beta:                  2.0
lambda_init:           1.0

initial_design_size:   1    # matches Exp A (forrester_1d)
budget:                30

num_restarts:          20
raw_samples:           1024
device:                cpu

methods:
  - vanilla_ucb
  - alpha_pi_ucb
  - lambda_pi_fixed_ucb
  - lambda_pi_adaptive_ucb
  - lambda_pi_fixed_standardized_ucb
  - lambda_pi_adaptive_standardized_ucb

# Hitting-time tolerance on the simple regret (RAW scale; ~5% of range ~21.85).
epsilon:               1.0

model:
  use_fixed_noise:     true
  normalize_input:     true
  # ON for vanilla / alpha-pi, forced OFF for the prior-to-the-mean methods.
  standardize_output:  true

test_grid:
  n_test:              512
  seed:                123
  calibration_every:   5

calibration:
  compute_global:        true
  compute_prior_region:  true
  prior_region_threshold: 0.5
  compute_joint:         false
  store_predictions:     true

aggregate:
  baseline_method:                vanilla_ucb
  convergence_band_type:          pointwise
  calibration_band_type:          pointwise
  residual_band_type:             uniform
  n_bootstrap:                    2000
  confidence:                     0.95
  aggregate_calibration_curves:   true
  aggregate_instantaneous_curves: true
